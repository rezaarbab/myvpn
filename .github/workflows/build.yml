name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      upx:
        description: "فشرده‌سازی UPX روی کتابخانه (آزمایشی — احتمال کرش دارد)"
        required: false
        default: false
        type: boolean

env:
  # نسخه‌ی هسته‌ی sing-box — خط 1.12: هسته‌ی کلاسیک بدون daemon/gRPC (سبک) با پشتیبانی کامل پروتکل‌های مدرن
  CORE_REF: v1.12.25
  # تگ‌های بیلد: حداقلی — with_clash_api برای خودِ libbox اجباری است،
  # with_utls برای Reality؛ quic (Hysteria2/TUIC) و wireguard حذف شدند تا حجم به کف برسد
  # (برای برگرداندن: با_quic و with_wireguard را اضافه کن)
  CORE_TAGS: with_clash_api,with_utls
  # فورک رسمی gomobile پروژه sing-box
  GOMOBILE_VERSION: v0.1.13
  # شیم pidfd هسته به os.checkPidfdOnce گو نیاز دارد که از 1.24+ موجود است
  GO_VERSION: "1.25.5"

jobs:
  build:
    name: Build core + APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout sing-box at CORE_REF
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ env.CORE_REF }}
          path: sing-box

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install gomobile (sagernet fork, same as official Makefile)
        run: |
          go install -v github.com/sagernet/gomobile/cmd/gomobile@$GOMOBILE_VERSION
          go install -v github.com/sagernet/gomobile/cmd/gobind@$GOMOBILE_VERSION
          gomobile init

      - name: Build AAR (arm64 + x86_64)
        working-directory: sing-box
        run: |
          mkdir -p ../app/libs
          gomobile bind -v \
            -o ../app/libs/libbox.aar \
            -target android \
            -androidapi 24 \
            -javapkg=io.nekohasekai \
            -libname=box \
            -buildvcs=false \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=$CORE_REF -X runtime.godebugDefault=multipathtcp=0,tlssha1=1 -checklinkname=0 -s -w -buildid=" \
            -trimpath \
            -tags "$CORE_TAGS" \
            ./experimental/libbox

      - name: Optional UPX pack of native library
        if: ${{ inputs.upx == true }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq upx-ucl zip unzip
          mkdir aar-tmp && cd aar-tmp
          unzip -q ../app/libs/libbox.aar
          upx --best --lzma jni/arm64-v8a/libbox.so || true
          upx --best --lzma jni/x86_64/libbox.so || true
          zip -q -r ../app/libs/libbox.aar .
          cd .. && rm -rf aar-tmp

      - name: Prepare signing keystore
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP"
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          else
            echo "no signing secret found; generating an ephemeral keystore"
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/release.keystore" \
              -alias myvpn -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass myvpn-signing -keypass myvpn-signing \
              -dname "CN=MyVPN"
          fi
          {
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "SIGNING_STORE_PASSWORD=${SIGNING_STORE_PASSWORD:-myvpn-signing}"
            echo "SIGNING_KEY_ALIAS=${SIGNING_KEY_ALIAS:-myvpn}"
            echo "SIGNING_KEY_PASSWORD=${SIGNING_KEY_PASSWORD:-myvpn-signing}"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          set +e
          ./gradlew assembleRelease --stacktrace --console=plain 2>&1 | tee gradle.log
          status="${PIPESTATUS[0]}"
          set -e
          # خطاهای کامپایل Kotlin را به‌صورت annotation منتشر می‌کند تا در تب Summary و از REST API هم دیده شوند
          if [ "$status" != "0" ]; then
            grep -E "^e: " gradle.log | sed 's/%/%25/g' | head -60 | while IFS= read -r line; do
              path=$(printf '%s' "$line" | sed -E 's|^e: (file://)?([^:]+\.kt):.*|\2|')
              line_no=$(printf '%s' "$line" | sed -E 's|^e: (file://)?[^:]+\.kt:([0-9]+):.*|\2|')
              if [ "$path" != "$line" ] && [ -n "$line_no" ]; then
                echo "::error file=${path##*/},line=${line_no}::${line}"
              else
                echo "::error::${line}"
              fi
            done
            echo "::error::build failed (exit $status)"
          fi
          exit "$status"

      - name: Upload R8 mapping (رمزگشایی stack trace های release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-txt
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload generated keystore (keep it for future updates)
        if: env.SIGNING_KEYSTORE_B64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: ${{ runner.temp }}/release.keystore
          retention-days: 14

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/*.apk \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
