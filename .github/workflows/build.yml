name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # نسخه‌ی هسته‌ی sing-box — برای ارتقا فقط همین را عوض کنید
  CORE_REF: v1.14.2
  # تگ‌های بیلد: سبک و کلاینت‌محور — بدون tailscale/openvpn/openconnect/usbip/naive (ده‌ها مگابایت)
  # و بدون gvisor (استک system) — حجم هدف زیر ۱۰ مگابایت
  CORE_TAGS: with_quic,with_utls,with_wireguard,badlinkname,tfogo_checklinkname0
  # فورک رسمی gomobile پروژه sing-box (خودش در go.mod هست؛ نیازی به go get نیست)
  GOMOBILE_VERSION: v0.1.13

jobs:
  build:
    name: Build core + APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout sing-box at CORE_REF
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ env.CORE_REF }}
          path: sing-box

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sing-box/go.mod

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install gomobile (sagernet fork, same as official Makefile)
        run: |
          go install -v github.com/sagernet/gomobile/cmd/gomobile@$GOMOBILE_VERSION
          go install -v github.com/sagernet/gomobile/cmd/gobind@$GOMOBILE_VERSION
          gomobile init

      - name: Build AAR (arm64 only)
        working-directory: sing-box
        run: |
          mkdir -p ../app/libs
          gomobile bind -v \
            -o ../app/libs/libbox.aar \
            -target android/arm64 \
            -androidapi 24 \
            -javapkg=io.nekohasekai \
            -libname=box \
            -buildvcs=false \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=$CORE_REF -X runtime.godebugDefault=multipathtcp=0,tlssha1=1 -checklinkname=0 -s -w -buildid=" \
            -trimpath \
            -tags "$CORE_TAGS" \
            ./experimental/libbox

      - name: Prepare signing keystore
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP"
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          else
            echo "no signing secret found; generating an ephemeral keystore"
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/release.keystore" \
              -alias myvpn -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass myvpn-signing -keypass myvpn-signing \
              -dname "CN=MyVPN"
          fi
          {
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "SIGNING_STORE_PASSWORD=${SIGNING_STORE_PASSWORD:-myvpn-signing}"
            echo "SIGNING_KEY_ALIAS=${SIGNING_KEY_ALIAS:-myvpn}"
            echo "SIGNING_KEY_PASSWORD=${SIGNING_KEY_PASSWORD:-myvpn-signing}"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload generated keystore (keep it for future updates)
        if: env.SIGNING_KEYSTORE_B64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: ${{ runner.temp }}/release.keystore
          retention-days: 14

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/*.apk \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
